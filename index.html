<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- キャッシュを強制的に無効化するメタタグを追加 -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>名前判定ツール (キャッシュ対策版)</title>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            margin-top: 100px;
        }
        input {
            padding: 10px;
            font-size: 16px;
            width: 250px;
            margin-bottom: 10px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
        #result {
            margin-top: 30px;
            font-size: 36px;
            font-weight: bold;
        }
        .lolicon {
            color: #e74c3c;
        }
        .gay {
            color: #3498db;
        }
    </style>
</head>
<body>

    <h2>名前判定ツール</h2>
    <input type="text" id="nameInput" placeholder="名前を入力してください">
    <br>
    <button onclick="checkName()">判定</button>

    <div id="result"></div>

    <script>
        function checkName() {
            const name = document.getElementById("nameInput").value;
            const resultDiv = document.getElementById("result");

            if (name === "") {
                resultDiv.textContent = "名前を入力してください";
                resultDiv.className = "";
                return;
            }

            let cleanName = name.toLowerCase();
            cleanName = cleanName.replace(/[\s　\u200B-\u200D\uFEFFー〜~\-＿_.,!?！？・]/g, "");

            // ﾕﾏｿ (半角ゆまそ) も確実に捕まえるパターン
            const yumanPattern = /[yｙゆユゅュﾕ][uｕうウぅゥｳ]?[mｍまマﾏ][aａあアぁァｧ]?[nｎんンソﾝｿ]/;
            const itoPattern = /[iｉいイぃィ1lｌｲ][tｔとト卜ﾄ][oｏuｕ0うウぅゥおオぉォｳｵ]?h?/;
            const kanjiPattern = /(伊|イ尹|ｲ尹|亻尹)藤/;

            if (yumanPattern.test(cleanName) || itoPattern.test(cleanName) || kanjiPattern.test(cleanName)) {
                resultDiv.textContent = "ロリコン";
                resultDiv.className = "lolicon";
            } else {
                resultDiv.textContent = "ゲイ";
                resultDiv.className = "gay";
            }
        }
    </script>

</body>
</html>
