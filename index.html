<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>名前判定ツール</title>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            margin-top: 100px;
        }
        input {
            padding: 10px;
            font-size: 16px;
            width: 250px;
            margin-bottom: 10px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
        #result {
            margin-top: 30px;
            font-size: 36px;
            font-weight: bold;
        }
        .lolicon {
            color: #e74c3c;
        }
        .gay {
            color: #3498db;
        }
    </style>
</head>
<body>

    <h2>名前判定ツール</h2>
    <input type="text" id="nameInput" placeholder="名前を入力してください">
    <br>
    <button onclick="checkName()">判定</button>

    <div id="result"></div>

    <script>
        function checkName() {
            const name = document.getElementById("nameInput").value;
            const resultDiv = document.getElementById("result");

            if (name === "") {
                resultDiv.textContent = "名前を入力してください";
                resultDiv.className = "";
                return;
            }

            // 1. 小文字化（変換エラーを防ぐため、シンプルな処理に留める）
            let cleanName = name.toLowerCase();

            // 2. ノイズ文字の削除（空白、長音符、アンダースコア、ドットなどを消し去る）
            cleanName = cleanName.replace(/[\s　\u200B-\u200D\uFEFFー〜~\-＿_.,!?！？・]/g, "");

            // 3. 変換に頼らず、全角・半角どちらが来ても絶対に捕まえる正規表現

            // YUMAN系統（ﾕﾏｿなどの半角カタカナも直接指定）
            const yumanPattern = /[yｙゆユゅュﾕ][uｕうウぅゥｳ]?[mｍまマﾏ][aａあアぁァｧ]?[nｎんンソﾝｿ]/;

            // ITOU系統（ローマ字や、いとう等のひらがなカタカナ。伊東は除外）
            const itoPattern = /[iｉいイぃィ1lｌｲ][tｔとト卜ﾄ][oｏuｕ0うウぅゥおオぉォｳｵ]?h?/;

            // 伊藤の漢字系統（イ尹、ｲ尹、亻尹 などの視覚トリック偽装を網羅）
            const kanjiPattern = /(伊|イ尹|ｲ尹|亻尹)藤/;

            // どれか1つでも引っかかればロリコン判定
            if (yumanPattern.test(cleanName) || itoPattern.test(cleanName) || kanjiPattern.test(cleanName)) {
                resultDiv.textContent = "ロリコン";
                resultDiv.className = "lolicon";
            } else {
                resultDiv.textContent = "ゲイ";
                resultDiv.className = "gay";
            }
        }
    </script>

</body>
</html>
