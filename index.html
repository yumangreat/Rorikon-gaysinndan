<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 強力なキャッシュ無効化対策 -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>真の性癖を暴くシステム</title>
    <style>
        body {
            background-color: #0a0a0a;
            color: #00ff00; /* サイバーな緑色 */
            font-family: 'Courier New', Courier, monospace, sans-serif;
            text-align: center;
            margin-top: 80px;
        }
        h2 {
            color: #ffffff;
            letter-spacing: 2px;
            text-shadow: 0 0 10px #00ff00;
        }
        input {
            padding: 12px;
            font-size: 16px;
            width: 350px;
            margin-bottom: 15px;
            background-color: #1a1a1a;
            color: #00ff00;
            border: 1px solid #00ff00;
            outline: none;
            transition: 0.3s;
        }
        input:focus {
            box-shadow: 0 0 15px #00ff00;
            background-color: #222;
        }
        button {
            padding: 10px 30px;
            font-size: 16px;
            background-color: #00ff00;
            color: #000;
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover {
            background-color: #ffffff;
            box-shadow: 0 0 15px #ffffff;
        }
        #result {
            margin-top: 40px;
            font-size: 45px;
            font-weight: bold;
            letter-spacing: 5px;
        }
        .lolicon {
            color: #ff3333;
            text-shadow: 0 0 15px #ff0000;
        }
        .gay {
            color: #3388ff;
            text-shadow: 0 0 15px #0044ff;
        }
        .error {
            color: #ffff00;
            font-size: 20px;
        }
    </style>
</head>
<body>

    <h2>真の性癖を暴くシステム</h2>
    <input type="text" id="nameInput" placeholder="ターゲットの呼称を入力せよ（※単語のみ有効）">
    <br>
    <button onclick="checkName()">解析実行</button>

    <div id="result"></div>

    <script>
        function checkName() {
            const name = document.getElementById("nameInput").value;
            const resultDiv = document.getElementById("result");

            if (name.trim() === "") {
                resultDiv.textContent = "対象者が指定されていません。";
                resultDiv.className = "error";
                return;
            }

            // 【第一形態: Zalgo(装飾文字)の破壊 ＆ 小文字化】
            // 文字に付与された特殊な点々(ダイアクリティカルマーク)を分解し、強制消去
            let cleanName = name.normalize("NFD").replace(/[\u0300-\u036f]/g, "").normalize("NFKC").toLowerCase();

            // 【第二形態: 偽装文字（Leet表記）のあぶり出しと修復】
            cleanName = cleanName.replace(/r\s*n/g, "m");   // yurnan(rn偽装) -> yuman
            cleanName = cleanName.replace(/[@4]/g, "a");    // yum@n -> yuman
            cleanName = cleanName.replace(/[¥\\]/g, "y");   // ¥uman -> yuman
            cleanName = cleanName.replace(/[μv]/g, "u");    // yvman -> yuman
            cleanName = cleanName.replace(/0/g, "o");       // 1t0u -> 1tou

            // 【第三形態: ノイズの完全消去】
            // 空白、改行(コピー時の\n)、長音符、見えない制御文字、記号をすべて「無」にする
            cleanName = cleanName.replace(/[\s\u200B-\u200D\uFEFF\u202A-\u202E\u2066-\u2069ー〜~\-＿_.,!?！？・]/g, "");

            // 【第四形態: ターゲットパターンの生成】
            // ※「Itou」すり抜け問題は、[o u お う 等] の母音が『1回以上(+)』連続しても良い設定に変更して解決済み
            const yumanCore = /[yｙゆユゅュﾕ][uｕうウぅゥｳ]?[mｍまマﾏ][aａあアぁァｧ]?[nｎんンソﾝｿ]/.source;
            const itoCore = /([iｉいイぃィ1lｌｲ][tｔとト卜ﾄ][oｏuｕ0うウぅゥおオぉォｳｵ]+h?|(伊|イ尹|ｲ尹|亻尹)藤)/.source;
            const shinCore = /(s[hｈ]?i[nｎんンソﾝｿ]|しん|シン|シソ|心)/.source;
            
            // 敬称リスト (※第一形態の処理で濁点が消える対策として、「どの」だけでなく「との」も登録)
            const suffixes = /(さん|サン|san|くん|クン|kun|君|様|さま|サマ|sama|ちゃん|チャン|chan|先輩|センパイ|先生|センセイ|たん|タン|氏|殿|どの|との|ドノ|トノ|bot|野郎|やろう|ヤロウ|め|メ|っち|ッチ|マン|まん|man)?/.source;

            // ターゲット単体の組み立て
            const yumanTarget = `(${yumanCore}${suffixes})`;
            const itoTarget = `(${itoCore}(${shinCore})?${suffixes})`;
            const targetName = `(${yumanTarget}|${itoTarget})`;

            // 接続詞と代名詞リスト (濁点消失対策済み)
            const pronouns = /(僕|ぼく|ほく|ボク|ホク|俺|おれ|オレ|私|わたし|ワタシ|自分|じぶん|しふん|ジブン|シフン|ワイ|わい|うち|ウチ)/.source;
            const connectors = /(と|&|＆|＋|\+|x|×)?/.source;

            // 【最終防衛ライン: 完全一致ルール (A案)】
            // ターゲット単体、または「自分＋ターゲット」、または「ターゲット＋自分」のみ許可
            const finalRegex = new RegExp(`^(${targetName}|${pronouns}${connectors}${targetName}|${targetName}${connectors}${pronouns})$`);

            // 判決を下す
            if (finalRegex.test(cleanName)) {
                resultDiv.textContent = "ロリコン";
                resultDiv.className = "lolicon";
            } else {
                resultDiv.textContent = "ゲイ";
                resultDiv.className = "gay";
            }
        }
    </script>

</body>
</html>
