<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>名前判定ツール</title>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            margin-top: 100px;
        }
        input {
            padding: 10px;
            font-size: 16px;
            width: 250px;
            margin-bottom: 10px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
        #result {
            margin-top: 30px;
            font-size: 36px;
            font-weight: bold;
        }
        .lolicon {
            color: #e74c3c; /* 赤系 */
        }
        .gay {
            color: #3498db; /* 青系 */
        }
    </style>
</head>
<body>

    <h2>名前判定ツール</h2>
    <input type="text" id="nameInput" placeholder="名前を入力してください">
    <br>
    <button onclick="checkName()">判定</button>

    <div id="result"></div>

    <script>
        function checkName() {
            // 入力された名前を取得
            const name = document.getElementById("nameInput").value;
            const resultDiv = document.getElementById("result");

            // 未入力の場合の処理
            if (name === "") {
                resultDiv.textContent = "名前を入力してください";
                resultDiv.className = "";
                return;
            }

            // 1. 全角半角統一(NFKC) ＋ 英字を小文字化 ＋ 余計なスペース(空白)を削除
            let normalizedName = name.normalize("NFKC").toLowerCase().replace(/\s+/g, "");

            // 2. カタカナ(半角カタカナもNFKCで全角になっている)を、すべて「ひらがな」に変換
            // これにより「いトウ」「ｲﾄｳ」はすべて「いとう」に、「ユマん」は「ゆまん」になります
            normalizedName = normalizedName.replace(/[\u30a1-\u30f6]/g, function(match) {
                return String.fromCharCode(match.charCodeAt(0) - 0x60);
            });

            // 3. 徹底的に統一された文字列でキーワード判定
            if (normalizedName.includes("yuman") || 
                normalizedName.includes("yuuman") || // ローマ字 (ユーマン)
                normalizedName.includes("ito") ||    // ローマ字 (ito, itou, itohすべてに反応します)
                normalizedName.includes("いとう") ||   // ひらがな (イトウ、ｲﾄｳ、いトウもこれに反応します)
                normalizedName.includes("ゆまん") ||   // ひらがな (ユマン、ﾕﾏﾝ、ゆマんもこれに反応します)
                normalizedName.includes("ゆーまん") || // ひらがな長音
                normalizedName.includes("伊藤")) {
                
                resultDiv.textContent = "ロリコン";
                resultDiv.className = "lolicon";
                
            } else {
                
                resultDiv.textContent = "ゲイ";
                resultDiv.className = "gay";
                
            }
        }
    </script>

</body>
</html>
