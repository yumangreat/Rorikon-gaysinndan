<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>名前判定ツール</title>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            margin-top: 100px;
        }
        input {
            padding: 10px;
            font-size: 16px;
            width: 250px;
            margin-bottom: 10px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
        #result {
            margin-top: 30px;
            font-size: 36px;
            font-weight: bold;
        }
        .lolicon {
            color: #e74c3c;
        }
        .gay {
            color: #3498db;
        }
    </style>
</head>
<body>

    <h2>名前判定ツール</h2>
    <input type="text" id="nameInput" placeholder="名前を入力してください">
    <br>
    <button onclick="checkName()">判定</button>

    <div id="result"></div>

    <script>
        function checkName() {
            const name = document.getElementById("nameInput").value;
            const resultDiv = document.getElementById("result");

            if (name === "") {
                resultDiv.textContent = "名前を入力してください";
                resultDiv.className = "";
                return;
            }

            // 半角カタカナを全角に、全角英字を半角にし、大文字を小文字化して、空白をすべて消す
            // これにより「ﾕﾏﾝ」は「ユマン」として扱われます
            const normalizedName = name.normalize("NFKC").toLowerCase().replace(/[\s　]+/g, "");

            // 網羅するキーワードのリスト
            const targetWords = [
                "yuman", "yuuman", "yuhman", // ローマ字ゆまん
                "ito", "itou", "itoh",       // ローマ字いとう
                "いとう", "イトウ",            // いとう系
                "ゆまん", "ユマン",            // ゆまん系
                "ゆーまん", "ユーマン",        // ゆーまん系
                "伊藤"                       // 漢字
            ];

            // normalizedNameの中に、targetWordsのどれか1つでも含まれているか判定
            const isMatch = targetWords.some(word => normalizedName.includes(word));

            if (isMatch) {
                resultDiv.textContent = "ロリコン";
                resultDiv.className = "lolicon";
            } else {
                resultDiv.textContent = "ゲイ";
                resultDiv.className = "gay";
            }
        }
    </script>

</body>
</html>
