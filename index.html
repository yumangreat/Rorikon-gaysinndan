<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>名前判定ツール</title>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            margin-top: 100px;
        }
        input {
            padding: 10px;
            font-size: 16px;
            width: 250px;
            margin-bottom: 10px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
        #result {
            margin-top: 30px;
            font-size: 36px;
            font-weight: bold;
        }
        .lolicon {
            color: #e74c3c;
        }
        .gay {
            color: #3498db;
        }
    </style>
</head>
<body>

    <h2>名前判定ツール</h2>
    <input type="text" id="nameInput" placeholder="名前を入力してください">
    <br>
    <button onclick="checkName()">判定</button>

    <div id="result"></div>

    <script>
        function checkName() {
            const name = document.getElementById("nameInput").value;
            const resultDiv = document.getElementById("result");

            if (name === "") {
                resultDiv.textContent = "名前を入力してください";
                resultDiv.className = "";
                return;
            }

            // 1. 全角半角統一と小文字化
            let cleanName = name.normalize("NFKC").toLowerCase();

            // 2. 妨害工作の徹底破壊
            // \p{P}: 句読点やカッコなどの記号  \p{S}: 数学記号や絵文字など  \p{Z}: あらゆる空白
            // \u200B-\u200D\uFEFF: 目に見えないゼロ幅文字
            // ー〜~-\_: 長音符やハイフン、アンダースコア
            // これらをすべて「無（カラ）」に置換して消し去る
            cleanName = cleanName.replace(/[\p{P}\p{S}\p{Z}\u200B-\u200D\uFEFFー〜~\-＿_]/gu, "");

            // 3. 抜け道を許さない最凶の正規表現パターン
            
            // YUMAN系統（y, ゆ系 + u系(省略可) + m, ま系 + a系(省略可) + n, ん, ン, ソ）
            const yumanPattern = /[yｙゆユゅュ][uｕうウぅゥ]?[mｍまマ][aａあアぁァ]?[nｎんンソ]/;

            // ITOU系統（i, い, 1, l系 + t, と, 卜(漢字)系 + o, u, 0, お, う系(省略可) + h(省略可)）
            const itoPattern = /[iｉいイぃィ1lｌ][tｔとト卜][oｏuｕ0うウぅゥおオぉォ]?h?/;

            // 漢字系統（伊藤だけでなく、念のため伊東も追加）
            const kanjiPattern = /伊[藤東]/;

            // どれか1つでも引っかかればアウト
            if (yumanPattern.test(cleanName) || itoPattern.test(cleanName) || kanjiPattern.test(cleanName)) {
                resultDiv.textContent = "ロリコン";
                resultDiv.className = "lolicon";
            } else {
                resultDiv.textContent = "ゲイ";
                resultDiv.className = "gay";
            }
        }
    </script>

</body>
</html>
